http:
  middlewares:
    # Security Headers
    sec-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: false
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"

    # Gzip & Brotli Compression
    compress:
      compress: {}

    # Redirect to HTTPS (Can be attached to HTTP routers when running on production)
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true
