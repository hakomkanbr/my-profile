services:
  my-profile:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-profile-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - platform_backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=platform_backend"

      # Traefik Router Configuration
      - "traefik.http.routers.my-profile.rule=Host(`${DOMAIN:-YOUR_DOMAIN}`)"
      - "traefik.http.routers.my-profile.entrypoints=websecure"
      - "traefik.http.routers.my-profile.tls=true"
      - "traefik.http.routers.my-profile.tls.certresolver=letsencrypt"
      - "traefik.http.routers.my-profile.service=my-profile"

      # Traefik Service Configuration
      - "traefik.http.services.my-profile.loadbalancer.server.port=3000"

networks:
  platform_backend:
    external: true
